<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1c5cd6">
  <title>Product Finder</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand"><img src="icon.svg" alt="" width="28" height="28"><span>Product Finder</span></div>
    <form id="form" class="search" role="search" autocomplete="off">
      <input id="q" type="search" placeholder="Search a product, e.g. iPhone 16" aria-label="Product search" maxlength="80" enterkeyhint="search">
      <button type="submit" aria-label="Search">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      </button>
    </form>
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="local" aria-selected="true">Local <small>Pakistan</small></button>
      <button role="tab" data-tab="intl" aria-selected="false">International</button>
    </div>
  </header>

  <main id="main">
    <section id="home" class="home">
      <p class="lead">Search for a product. The app checks every store and shows where it is <b>cheapest</b> and where it is the <b>best deal</b>. Tap a card to open the store.</p>
      <div class="chips" id="examples"></div>
      <div id="storeList" class="muted small"></div>
    </section>
    <section id="results" hidden></section>
  </main>

  <script src="app.js"></script>
</body>
</html>
